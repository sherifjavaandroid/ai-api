<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>AI Free API Dashboard</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #0f172a; color: #e2e8f0; min-height: 100vh; }
        .container { max-width: 900px; margin: 0 auto; padding: 20px; }
        h1 { text-align: center; margin: 30px 0 10px; font-size: 28px; color: #f1f5f9; }
        .subtitle { text-align: center; color: #64748b; margin-bottom: 30px; font-size: 14px; }
        .tabs { display: flex; gap: 8px; margin-bottom: 20px; }
        .tab { flex: 1; padding: 12px; border: 1px solid #334155; background: #1e293b; color: #94a3b8; border-radius: 8px; cursor: pointer; text-align: center; font-size: 14px; font-weight: 500; transition: all 0.2s; }
        .tab.active { background: #3b82f6; color: #fff; border-color: #3b82f6; }
        .tab:hover:not(.active) { background: #334155; }
        .card { background: #1e293b; border: 1px solid #334155; border-radius: 12px; padding: 24px; margin-bottom: 20px; }
        .card h2 { font-size: 18px; margin-bottom: 16px; color: #f1f5f9; display: flex; align-items: center; gap: 8px; }
        .status-dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
        .status-dot.online { background: #22c55e; }
        .status-dot.offline { background: #ef4444; }
        label { display: block; font-size: 13px; color: #94a3b8; margin-bottom: 6px; font-weight: 500; }
        .input-group { margin-bottom: 16px; }
        input[type="text"], input[type="password"], textarea { width: 100%; padding: 10px 14px; background: #0f172a; border: 1px solid #334155; border-radius: 8px; color: #e2e8f0; font-size: 14px; font-family: monospace; outline: none; transition: border-color 0.2s; }
        input:focus, textarea:focus { border-color: #3b82f6; }
        textarea { resize: vertical; min-height: 80px; }
        .btn { padding: 10px 20px; border: none; border-radius: 8px; font-size: 14px; font-weight: 500; cursor: pointer; transition: all 0.2s; }
        .btn-primary { background: #3b82f6; color: #fff; }
        .btn-primary:hover { background: #2563eb; }
        .btn-success { background: #22c55e; color: #fff; }
        .btn-success:hover { background: #16a34a; }
        .btn-danger { background: #ef4444; color: #fff; }
        .btn-danger:hover { background: #dc2626; }
        .btn-secondary { background: #334155; color: #e2e8f0; }
        .btn-secondary:hover { background: #475569; }
        .btn-row { display: flex; gap: 8px; flex-wrap: wrap; }
        .chat-box { background: #0f172a; border: 1px solid #334155; border-radius: 8px; min-height: 300px; max-height: 500px; overflow-y: auto; padding: 16px; margin-bottom: 16px; }
        .msg { margin-bottom: 12px; padding: 10px 14px; border-radius: 8px; max-width: 85%; word-wrap: break-word; white-space: pre-wrap; line-height: 1.5; font-size: 14px; }
        .msg.user { background: #3b82f6; color: #fff; margin-left: auto; }
        .msg.assistant { background: #334155; color: #e2e8f0; }
        .msg.system { background: #1e293b; color: #94a3b8; text-align: center; max-width: 100%; font-size: 13px; }
        .msg .thinking { color: #94a3b8; font-style: italic; font-size: 13px; border-left: 2px solid #64748b; padding-left: 10px; margin-bottom: 8px; }
        .chat-input { display: flex; gap: 8px; }
        .chat-input input { flex: 1; }
        .model-select { padding: 10px 14px; background: #0f172a; border: 1px solid #334155; border-radius: 8px; color: #e2e8f0; font-size: 14px; outline: none; cursor: pointer; }
        .model-select:focus { border-color: #3b82f6; }
        .endpoint-info { background: #0f172a; border: 1px solid #334155; border-radius: 8px; padding: 12px; margin-top: 12px; font-family: monospace; font-size: 13px; color: #94a3b8; word-break: break-all; }
        .toast { position: fixed; top: 20px; right: 20px; padding: 12px 20px; border-radius: 8px; font-size: 14px; z-index: 1000; animation: slideIn 0.3s ease; }
        .toast.success { background: #22c55e; color: #fff; }
        .toast.error { background: #ef4444; color: #fff; }
        @keyframes slideIn { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
        .hidden { display: none; }
        .flex-between { display: flex; justify-content: space-between; align-items: center; }
    </style>
</head>
<body>
    <div class="container">
        <h1>AI Free API Dashboard</h1>
        <p class="subtitle">Manage DeepSeek & Kimi tokens and test chat</p>

        <div class="tabs">
            <div class="tab active" onclick="switchTab('settings')">Settings</div>
            <div class="tab" onclick="switchTab('chat')">Chat</div>
            <div class="tab" onclick="switchTab('endpoints')">API Endpoints</div>
        </div>

        <!-- Settings Tab -->
        <div id="tab-settings">
            <div class="card">
                <h2><span class="status-dot" id="ds-status"></span> DeepSeek</h2>
                <div class="input-group">
                    <label>API Base URL</label>
                    <input type="text" id="ds-url" placeholder="http://localhost:8000" />
                </div>
                <div class="input-group">
                    <label>User Token (from chat.deepseek.com localStorage)</label>
                    <input type="password" id="ds-token" placeholder="Paste your DeepSeek userToken here..." />
                </div>
                <div class="btn-row">
                    <button class="btn btn-primary" onclick="saveSettings('ds')">Save</button>
                    <button class="btn btn-secondary" onclick="toggleVisibility('ds-token')">Show/Hide</button>
                    <button class="btn btn-success" onclick="testConnection('ds')">Test Connection</button>
                </div>
            </div>

            <div class="card">
                <h2><span class="status-dot" id="kimi-status"></span> Kimi (Moonshot)</h2>
                <div class="input-group">
                    <label>API Base URL</label>
                    <input type="text" id="kimi-url" placeholder="http://localhost:8001" />
                </div>
                <div class="input-group">
                    <label>Refresh Token (from kimi.moonshot.cn)</label>
                    <input type="password" id="kimi-token" placeholder="Paste your Kimi refresh_token here..." />
                </div>
                <div class="btn-row">
                    <button class="btn btn-primary" onclick="saveSettings('kimi')">Save</button>
                    <button class="btn btn-secondary" onclick="toggleVisibility('kimi-token')">Show/Hide</button>
                    <button class="btn btn-success" onclick="testConnection('kimi')">Test Connection</button>
                </div>
            </div>
        </div>

        <!-- Chat Tab -->
        <div id="tab-chat" class="hidden">
            <div class="card">
                <div class="flex-between" style="margin-bottom:16px">
                    <h2 style="margin:0">Chat</h2>
                    <div style="display:flex;gap:8px;align-items:center">
                        <select class="model-select" id="chat-provider">
                            <option value="ds">DeepSeek</option>
                            <option value="kimi">Kimi</option>
                        </select>
                        <select class="model-select" id="chat-model">
                            <option value="deepseek_chat">Chat</option>
                            <option value="deepseek_think">Think (R1)</option>
                            <option value="deepseek_search">Search</option>
                        </select>
                        <button class="btn btn-danger" onclick="clearChat()" style="padding:8px 14px">Clear</button>
                    </div>
                </div>
                <div class="chat-box" id="chat-box">
                    <div class="msg system">Select a provider and start chatting.</div>
                </div>
                <div class="chat-input">
                    <input type="text" id="chat-input" placeholder="Type a message..." onkeydown="if(event.key==='Enter')sendMessage()" />
                    <button class="btn btn-primary" onclick="sendMessage()" id="send-btn">Send</button>
                </div>
            </div>
        </div>

        <!-- Endpoints Tab -->
        <div id="tab-endpoints" class="hidden">
            <div class="card">
                <h2>API Usage</h2>
                <p style="color:#94a3b8;margin-bottom:16px;font-size:14px">Use these endpoints with any OpenAI-compatible client (LobeChat, NextChat, etc.)</p>

                <div class="input-group">
                    <label>DeepSeek Endpoint</label>
                    <div class="endpoint-info" id="ds-endpoint-display">Not configured</div>
                </div>
                <div class="input-group">
                    <label>Kimi Endpoint</label>
                    <div class="endpoint-info" id="kimi-endpoint-display">Not configured</div>
                </div>

                <div class="input-group" style="margin-top:20px">
                    <label>Example curl (DeepSeek)</label>
                    <textarea id="curl-example" readonly rows="6" style="font-size:12px"></textarea>
                </div>
            </div>
        </div>
    </div>

<script>
var MODELS = {
    ds: [
        { value: 'deepseek-chat', label: 'Chat' },
        { value: 'deepseek-coder', label: 'Coder' },
        { value: 'deepseek-think', label: 'Think (R1)' },
        { value: 'deepseek-r1', label: 'R1' },
        { value: 'deepseek-search', label: 'Search' },
        { value: 'deepseek-r1-search', label: 'R1 + Search' },
        { value: 'deepseek-think-search', label: 'Think + Search' },
        { value: 'deepseek-r1-silent', label: 'R1 Silent' },
        { value: 'deepseek-search-silent', label: 'Search Silent' },
        { value: 'deepseek-think-fold', label: 'Think Fold' },
        { value: 'deepseek-r1-fold', label: 'R1 Fold' },
    ],
    kimi: [
        { value: 'moonshot-v1', label: 'Moonshot V1' },
        { value: 'moonshot-v1-8k', label: 'Moonshot V1 8K' },
        { value: 'moonshot-v1-32k', label: 'Moonshot V1 32K' },
        { value: 'moonshot-v1-128k', label: 'Moonshot V1 128K' },
        { value: 'moonshot-v1-vision', label: 'Moonshot V1 Vision' },
    ]
};

let chatMessages = [];
let isStreaming = false;

function getConfig(provider) {
    return {
        url: localStorage.getItem(provider + '_url') || '',
        token: localStorage.getItem(provider + '_token') || '',
    };
}

function init() {
    var dsConf = getConfig('ds');
    var kimiConf = getConfig('kimi');
    document.getElementById('ds-url').value = dsConf.url || window.location.origin;
    document.getElementById('ds-token').value = dsConf.token;
    document.getElementById('kimi-url').value = kimiConf.url || 'http://localhost:8001';
    document.getElementById('kimi-token').value = kimiConf.token;

    document.getElementById('chat-provider').addEventListener('change', updateModelOptions);
    updateModelOptions();
    updateEndpoints();
    testConnection('ds');
    testConnection('kimi');
}

function updateModelOptions() {
    var provider = document.getElementById('chat-provider').value;
    var select = document.getElementById('chat-model');
    select.innerHTML = '';
    MODELS[provider].forEach(function(m) {
        var opt = document.createElement('option');
        opt.value = m.value;
        opt.textContent = m.label;
        select.appendChild(opt);
    });
}

function switchTab(name) {
    document.querySelectorAll('.tabs .tab').forEach(function(t) { t.classList.remove('active'); });
    document.querySelectorAll('[id^="tab-"]').forEach(function(t) { t.classList.add('hidden'); });
    event.target.classList.add('active');
    document.getElementById('tab-' + name).classList.remove('hidden');
}

function saveSettings(provider) {
    var url = document.getElementById(provider + '-url').value.trim().replace(/\/$/, '');
    var token = document.getElementById(provider + '-token').value.trim();
    localStorage.setItem(provider + '_url', url);
    localStorage.setItem(provider + '_token', token);
    showToast('Settings saved!', 'success');
    updateEndpoints();
    testConnection(provider);
}

function toggleVisibility(id) {
    var input = document.getElementById(id);
    input.type = input.type === 'password' ? 'text' : 'password';
}

async function testConnection(provider) {
    var url = document.getElementById(provider + '-url').value.trim().replace(/\/$/, '');
    var dot = document.getElementById(provider + '-status');
    dot.className = 'status-dot';
    try {
        var res = await fetch(url + '/ping', { signal: AbortSignal.timeout(5000) });
        dot.classList.add(res.ok ? 'online' : 'offline');
    } catch(e) {
        dot.classList.add('offline');
    }
}

function updateEndpoints() {
    var dsUrl = document.getElementById('ds-url').value.trim() || window.location.origin;
    var kimiUrl = document.getElementById('kimi-url').value.trim() || 'http://localhost:8001';
    var dsToken = document.getElementById('ds-token').value.trim() || '<YOUR_TOKEN>';
    document.getElementById('ds-endpoint-display').textContent = dsUrl + '/v1/chat/completions';
    document.getElementById('kimi-endpoint-display').textContent = kimiUrl + '/v1/chat/completions';
    document.getElementById('curl-example').value =
        'curl ' + dsUrl + '/v1/chat/completions \\\n' +
        '  -H "Content-Type: application/json" \\\n' +
        '  -H "Authorization: Bearer ' + dsToken + '" \\\n' +
        '  -d \'{"model":"deepseek_chat","messages":[{"role":"user","content":"Hello"}]}\'';
}

function clearChat() {
    chatMessages = [];
    document.getElementById('chat-box').innerHTML = '<div class="msg system">Chat cleared.</div>';
}

function appendMsg(role, content, thinking) {
    var box = document.getElementById('chat-box');
    var div = document.createElement('div');
    div.className = 'msg ' + role;
    if (thinking) {
        div.innerHTML = '<div class="thinking">' + escapeHtml(thinking) + '</div>' + escapeHtml(content);
    } else {
        div.textContent = content;
    }
    box.appendChild(div);
    box.scrollTop = box.scrollHeight;
    return div;
}

function escapeHtml(text) {
    var d = document.createElement('div');
    d.textContent = text;
    return d.innerHTML;
}

async function sendMessage() {
    if (isStreaming) return;
    var input = document.getElementById('chat-input');
    var text = input.value.trim();
    if (!text) return;

    var provider = document.getElementById('chat-provider').value;
    var model = document.getElementById('chat-model').value;
    var url = document.getElementById(provider + '-url').value.trim().replace(/\/$/, '');
    var token = document.getElementById(provider + '-token').value.trim();

    if (!url || !token) {
        showToast('Configure URL and token in Settings first!', 'error');
        return;
    }

    chatMessages.push({ role: 'user', content: text });
    appendMsg('user', text);
    input.value = '';

    var assistantDiv = appendMsg('assistant', '...');
    var sendBtn = document.getElementById('send-btn');
    sendBtn.textContent = '...';
    isStreaming = true;

    try {
        var res = await fetch(url + '/v1/chat/completions', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token },
            body: JSON.stringify({ model: model, messages: chatMessages, stream: true }),
        });

        if (!res.ok) {
            var err = await res.text();
            throw new Error(err);
        }

        var reader = res.body.getReader();
        var decoder = new TextDecoder();
        var content = '';
        var reasoning = '';
        var buffer = '';

        while (true) {
            var chunk = await reader.read();
            if (chunk.done) break;
            buffer += decoder.decode(chunk.value, { stream: true });

            var lines = buffer.split('\n');
            buffer = lines.pop();

            for (var i = 0; i < lines.length; i++) {
                var trimmed = lines[i].trim();
                if (!trimmed || trimmed.indexOf('data: ') !== 0) continue;
                var data = trimmed.slice(6);
                if (data === '[DONE]') continue;
                try {
                    var parsed = JSON.parse(data);
                    var delta = parsed.choices && parsed.choices[0] && parsed.choices[0].delta;
                    if (delta && delta.content) content += delta.content;
                    if (delta && delta.reasoning_content) reasoning += delta.reasoning_content;
                } catch(e) {}
            }

            if (reasoning) {
                assistantDiv.innerHTML = '<div class="thinking">' + escapeHtml(reasoning) + '</div>' + escapeHtml(content);
            } else {
                assistantDiv.textContent = content || '...';
            }
            document.getElementById('chat-box').scrollTop = document.getElementById('chat-box').scrollHeight;
        }

        chatMessages.push({ role: 'assistant', content: content });
    } catch (err) {
        assistantDiv.textContent = 'Error: ' + err.message;
        assistantDiv.style.color = '#ef4444';
    } finally {
        isStreaming = false;
        sendBtn.textContent = 'Send';
    }
}

function showToast(msg, type) {
    var toast = document.createElement('div');
    toast.className = 'toast ' + type;
    toast.textContent = msg;
    document.body.appendChild(toast);
    setTimeout(function() { toast.remove(); }, 3000);
}

init();
</script>
</body>
</html>
